# Desarrollo local: PostgreSQL y la API. Uso: docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kuntur
      POSTGRES_PASSWORD: kuntur
      POSTGRES_DB: kuntur
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kuntur']
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: '3000'
      DATABASE_URL: postgres://kuntur:kuntur@db:5432/kuntur
    ports: ['3000:3000']
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
