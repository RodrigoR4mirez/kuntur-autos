# Crea las tablas en la base de datos de staging (Neon), carga el catálogo inicial y comprueba la conexión.
# Se lanza a mano. Es seguro repetirlo: las migraciones y el catálogo no duplican nada.
name: Base de datos staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrar y comprobar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Comprobar que el secreto DATABASE_URL existe
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secreto DATABASE_URL en el entorno staging (docs/06-ci-cd.md)."
            exit 1
          fi
      - uses: ./.github/actions/setup
      - name: Crear tablas y cargar el catálogo inicial
        run: pnpm db:seed
      - name: Comprobar la conexión
        run: pnpm db:check
