# Integración continua: valida cada cambio antes de fusionarlo.
# Se ejecuta en cada pull request. En main lo reutiliza el despliegue (workflow_call).
name: CI

# En main no se dispara solo: lo ejecuta el flujo 'Despliegue a staging', que no despliega si CI falla.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validar (tipos, formato, dependencias, pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # PostgreSQL real para las suites de contrato de los adaptadores.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # El host es localhost: las pruebas destructivas lo exigen para no tocar bases remotas.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Pruebas con cobertura (umbral en vitest.config.ts)
        run: pnpm test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: Imagen Docker (construir y escanear)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          push: false
          tags: kuntur-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Escanear la imagen (falla con vulnerabilidades altas o críticas que tengan arreglo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kuntur-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  infra:
    name: Infraestructura (validar Bicep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compilar y revisar la plantilla
        run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null
