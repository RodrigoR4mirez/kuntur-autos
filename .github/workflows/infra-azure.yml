# Crea o actualiza la INFRAESTRUCTURA de staging en Azure con Bicep. Se lanza a mano.
# Para cambiar la VERSIÓN de la API usa "Despliegue a staging" (se ejecuta solo en cada merge a main).
# Por defecto NO cambia la versión: mantiene la imagen que ya corre en Azure (ver docs/10-runbook.md).
name: Infraestructura Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno a crear o actualizar.'
        required: true
        default: staging
        type: choice
        options: [staging, production]
      image:
        description: 'Imagen a usar. Vacío (recomendado) = la que ya corre en Azure. Solo si sabes lo que haces: nombre@sha256:...'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: infra-azure-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    name: Aplicar Bicep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ENVIRONMENT_NAME: ${{ inputs.environment }}
      RESOURCE_GROUP: rg-kuntur-${{ inputs.environment }}
      APP_NAME: kuntur-api-${{ inputs.environment }}
      MIN_REPLICAS: ${{ inputs.environment == 'production' && '1' || '0' }}
      LOGIN_TEST_PAGE: ${{ vars.LOGIN_TEST_PAGE }}
      INPUT_IMAGE: ${{ inputs.image }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      SMTP_URL: ${{ secrets.SMTP_URL }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      AUTH_TRUSTED_ORIGINS: ${{ vars.AUTH_TRUSTED_ORIGINS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Resolver la imagen (no cambiar la versión por accidente)
        id: image
        run: |
          if [ -n "$INPUT_IMAGE" ]; then
            image="$INPUT_IMAGE"
          else
            image=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
              --query 'properties.template.containers[0].image' -o tsv 2>/dev/null || true)
            # Primera vez (la app aún no existe): se usa la última imagen de staging.
            [ -n "$image" ] || image="ghcr.io/rodrigor4mirez/kuntur-autos-api:staging"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Imagen que se usará: $image" >> "$GITHUB_STEP_SUMMARY"
      - name: Vista previa de cambios (what-if)
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          az deployment group what-if -g "$RESOURCE_GROUP" \
            --template-file infra/azure/main.bicep \
            --parameters image="$IMAGE" databaseUrl="$DATABASE_URL" appName="$APP_NAME" \
            environmentName="$ENVIRONMENT_NAME" minReplicas="$MIN_REPLICAS" loginTestPage="${LOGIN_TEST_PAGE:-false}" \
            authSecret="$AUTH_SECRET" googleClientId="$GOOGLE_CLIENT_ID" \
            googleClientSecret="$GOOGLE_CLIENT_SECRET" smtpUrl="$SMTP_URL" mailFrom="$MAIL_FROM" \
            authTrustedOrigins="$AUTH_TRUSTED_ORIGINS"
      - name: Aplicar
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          az deployment group create -g "$RESOURCE_GROUP" \
            --template-file infra/azure/main.bicep \
            --parameters image="$IMAGE" databaseUrl="$DATABASE_URL" appName="$APP_NAME" \
            environmentName="$ENVIRONMENT_NAME" minReplicas="$MIN_REPLICAS" loginTestPage="${LOGIN_TEST_PAGE:-false}" \
            authSecret="$AUTH_SECRET" googleClientId="$GOOGLE_CLIENT_ID" \
            googleClientSecret="$GOOGLE_CLIENT_SECRET" smtpUrl="$SMTP_URL" mailFrom="$MAIL_FROM" \
            authTrustedOrigins="$AUTH_TRUSTED_ORIGINS" \
            --query 'properties.outputs' -o json
