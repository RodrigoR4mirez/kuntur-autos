# Entrega continua a staging: CI completo -> imagen firmada y escaneada -> migración -> despliegue -> prueba de humo.
# Se activa solo si están configuradas las variables AZURE_* del repositorio (ver docs/06-ci-cd.md).
name: Despliegue a staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un solo despliegue a la vez; uno nuevo espera al actual en vez de cancelarlo a medias.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security:
    name: Seguridad
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  build:
    name: Construir y publicar la imagen
    needs: [ci, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nombre de la imagen (GHCR exige minúsculas)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kuntur-autos-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=long
            type=raw,value=staging
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Referencia inmutable de la imagen (nombre@digest)
        id: ref
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Escanear la imagen publicada
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Atestar el origen de la imagen (quién y cómo la construyó)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Desplegar a Azure Container Apps
    needs: build
    # Sin las variables de Azure el flujo termina en verde y avisa; no falla un repositorio sin nube.
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ steps.verify.outputs.url }}
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: ${{ vars.AZURE_CONTAINERAPP_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Iniciar sesión en Azure (OIDC, sin contraseñas guardadas)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Migrar la base de datos (antes de desplegar; migraciones compatibles hacia atrás)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:seed
      - name: Recordar la imagen actual para poder volver atrás
        id: previous
        run: |
          previous=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query 'properties.template.containers[0].image' -o tsv)
          echo "image=$previous" >> "$GITHUB_OUTPUT"
      - name: Desplegar la nueva imagen
        id: update
        run: az containerapp update -n "$APP_NAME" -g "$RESOURCE_GROUP" --image "$IMAGE" --output none
      - name: Prueba de humo
        id: verify
        run: |
          fqdn=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          url="https://${fqdn}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 15); do
            if curl -fsS --max-time 10 "$url/health" >/dev/null; then ok=1; break; fi
            echo "Intento $attempt sin respuesta, esperando..."; sleep 8
          done
          [ "${ok:-0}" = 1 ] || { echo "La API no respondió /health"; exit 1; }
          curl -fsS --max-time 10 "$url/catalog/brands" | grep -q '"brands"' \
            || { echo "El catálogo no responde desde la base de datos"; exit 1; }
          echo "Staging: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Volver a la versión anterior si algo falló
        if: ${{ failure() && steps.update.outcome == 'success' && steps.previous.outputs.image != '' }}
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
        run: |
          echo "Revirtiendo a $PREVIOUS_IMAGE"
          az containerapp update -n "$APP_NAME" -g "$RESOURCE_GROUP" --image "$PREVIOUS_IMAGE" --output none

  not-configured:
    name: Despliegue no configurado
    needs: build
    if: ${{ vars.AZURE_CLIENT_ID == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "::notice::La imagen se publicó, pero no hay despliegue. Configura las variables AZURE_* (docs/06-ci-cd.md)."
