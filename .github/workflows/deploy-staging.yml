# Entrega continua a staging: CI completo -> imagen firmada y escaneada -> despliegue reutilizable.
# Se activa en cada push a main y a mano. Producción NO se despliega aquí (ver deploy-production.yml).
name: Despliegue a staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un solo despliegue a la vez; uno nuevo espera al actual en vez de cancelarlo a medias.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security:
    name: Seguridad
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  build:
    name: Construir y publicar la imagen
    needs: [ci, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nombre de la imagen (GHCR exige minúsculas)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kuntur-autos-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=long
            type=raw,value=staging
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Referencia inmutable de la imagen (nombre@digest)
        id: ref
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Escanear la imagen publicada
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Atestar el origen de la imagen (quién y cómo la construyó)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Desplegar a staging
    needs: build
    # Sin las variables de Azure el flujo termina en verde y avisa; no falla un repositorio sin nube.
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Iniciar sesión en Azure (OIDC, sin contraseñas guardadas)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: ./.github/actions/deploy-app
        with:
          image: ${{ needs.build.outputs.image }}
          resource_group: rg-kuntur-staging
          app_name: kuntur-api-staging
          database_url: ${{ secrets.DATABASE_URL }}

  not-configured:
    name: Despliegue no configurado
    needs: build
    if: ${{ vars.AZURE_CLIENT_ID == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "::notice::La imagen se publicó, pero no hay despliegue. Configura las variables AZURE_* (docs/06-ci-cd.md)."
