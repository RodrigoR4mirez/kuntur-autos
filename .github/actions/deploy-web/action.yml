# Despliegue de la web. Se usa DESPUÉS de deploy-app, en el mismo job (misma sesión de Azure y entorno).
# Si la app de la web aún no existe (primera vez), avisa y termina en verde: se crea con "Infraestructura Azure".
# Orden: recordar imagen actual -> actualizar -> prueba de humo (página, API y sesión a través de la web) -> revertir si falla.
name: Desplegar la web
description: Actualiza la Container App de la web, verifica que habla con la API y revierte si algo falla.

inputs:
  image:
    description: Imagen de la web con digest (nombre@sha256:...).
    required: true
  resource_group:
    description: Grupo de recursos de Azure del entorno.
    required: true
  app_name:
    description: Nombre de la Container App de la web del entorno.
    required: true

runs:
  using: composite
  steps:
    - name: Comprobar que la app de la web existe
      id: exists
      shell: bash
      env:
        RESOURCE_GROUP: ${{ inputs.resource_group }}
        APP_NAME: ${{ inputs.app_name }}
      run: |
        previous=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
          --query 'properties.template.containers[0].image' -o tsv 2>/dev/null || true)
        if [ -z "$previous" ]; then
          echo "::notice::La app de la web ($APP_NAME) no existe todavía. Ejecuta Infraestructura Azure para crearla (docs/10-runbook.md)."
          echo "present=false" >> "$GITHUB_OUTPUT"
        else
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "image=$previous" >> "$GITHUB_OUTPUT"
        fi

    - name: Desplegar la nueva imagen de la web
      id: update
      if: ${{ steps.exists.outputs.present == 'true' }}
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        RESOURCE_GROUP: ${{ inputs.resource_group }}
        APP_NAME: ${{ inputs.app_name }}
      run: az containerapp update -n "$APP_NAME" -g "$RESOURCE_GROUP" --image "$IMAGE" --output none

    - name: Prueba de humo de la web
      id: verify
      if: ${{ steps.exists.outputs.present == 'true' }}
      shell: bash
      env:
        RESOURCE_GROUP: ${{ inputs.resource_group }}
        APP_NAME: ${{ inputs.app_name }}
      run: |
        fqdn=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
          --query 'properties.configuration.ingress.fqdn' -o tsv)
        url="https://${fqdn}"
        for attempt in $(seq 1 15); do
          if curl -fsS --max-time 10 "$url/ingresar" >/dev/null; then ok=1; break; fi
          echo "Intento $attempt sin respuesta, esperando..."; sleep 8
        done
        [ "${ok:-0}" = 1 ] || { echo "La web no respondió /ingresar"; exit 1; }
        # La web debe llegar a la API y al catálogo (comprueba el reenvío y la configuración).
        curl -fsS --max-time 10 "$url/api/catalog/brands" | grep -q '"brands"' \
          || { echo "La web no llega al catálogo de la API"; exit 1; }
        # Sin sesión, publicar debe responder 401 (la API recibe la petición).
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST "$url/api/listings" \
          -H 'content-type: application/json' -d '{}')
        [ "$code" = 401 ] || { echo "POST /api/listings sin sesión devolvió $code (se esperaba 401)"; exit 1; }
        echo "Web desplegada: $url" >> "$GITHUB_STEP_SUMMARY"

    - name: Volver a la imagen anterior de la web si algo falló
      if: ${{ failure() && steps.update.outcome == 'success' && steps.exists.outputs.image != '' }}
      shell: bash
      env:
        PREVIOUS_IMAGE: ${{ steps.exists.outputs.image }}
        RESOURCE_GROUP: ${{ inputs.resource_group }}
        APP_NAME: ${{ inputs.app_name }}
      run: |
        echo "Revirtiendo la web a $PREVIOUS_IMAGE"
        az containerapp update -n "$APP_NAME" -g "$RESOURCE_GROUP" --image "$PREVIOUS_IMAGE" --output none
